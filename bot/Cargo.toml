[package]
name = "crebto-bot"
version = "0.2.1"
edition = "2021"

[dependencies]
alloy = { version = "0.3", features = ["full"] }
tokio = { version = "1.38", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
eyre = "0.6"
futures-util = "0.3"
reqwest = { version = "0.12", features = ["json"] }
dotenvy = "0.15.7"
dashmap = "6.0"
lru = "0.12"
